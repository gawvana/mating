<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Mating — AI-помощник для покупок в Telegram">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FBF8FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111218" media="(prefers-color-scheme: dark)">
  <title>Mating</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="root">
    <div id="mating-preloader" style="
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0b0b10; color: #f2f2f7;
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 99999; -webkit-font-smoothing: antialiased;
    ">
      <div style="
        width: 60px; height: 60px; border-radius: 20px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
        margin-bottom: 18px;
      ">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
      </div>
      <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px;">Mating</div>
      <div style="font-size: 13px; color: #8e8e93; margin-bottom: 22px;">AI-помощник для покупок</div>
      <div id="mating-spinner" style="
        width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.15);
        border-top-color: #6366f1; border-radius: 50%;
        animation: mating-spin 0.8s linear infinite;
      "></div>
      <div id="mating-fail" style="display: none; flex-direction: column; align-items: center; margin-top: 16px;">
        <p style="font-size: 14px; color: #ff6b6b; margin-bottom: 12px; font-weight: 600;">Mating не удалось загрузить</p>
        <button onclick="window.location.reload()" style="
          padding: 10px 22px; border-radius: 12px; border: none;
          background: #6366f1; color: white; font-weight: 600; font-size: 14px;
          cursor: pointer;
        ">[Повторить]</button>
      </div>
    </div>
    <style>
      @keyframes mating-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #mating-preloader { background: #fbf8ff; color: #1c1b1f; }
        #mating-spinner { border-color: rgba(0,0,0,0.1); border-top-color: #6366f1; }
      }
    </style>
    <script>
      setTimeout(function() {
        var spin = document.getElementById('mating-spinner');
        var fail = document.getElementById('mating-fail');
        if (spin && fail && document.getElementById('mating-preloader')) {
          spin.style.display = 'none';
          fail.style.display = 'flex';
        }
      }, 8000);
    </script>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
